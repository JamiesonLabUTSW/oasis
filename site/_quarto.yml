project:
  type: website
  output-dir: _site
  post-render: ../scripts/finalize-site.py
  resources:
    - .nojekyll
    - assets/**
    - images/**
    - paper/**
    - publication.json

website:
  title: OASIS
  description: "Project information, interactive guides, recorded product tours, and the OASIS technical report"
  site-url: https://jamiesonlabutsw.github.io/oasis/
  search: false
  favicon: images/oasis-favicon.png
  navbar:
    logo: images/oasis-logo-nav.webp
    logo-alt: OASIS
    search: false
    left:
      - href: index.qmd
        text: Home
      - text: Explore
        menu:
          - href: explore.qmd
            text: Tour overview
          - href: tui.qmd
            text: CLI & TUI
          - href: candle.qmd
            text: Candle CLI & MCP
          - href: elephant.qmd
            text: Elephant ingestion
          - href: maples.qmd
            text: MAPLES
          - href: rubric.qmd
            text: Improve a rubric
      - href: paper/paper.html
        text: Technical Report
      - href: paper/OASIS_technical_report.pdf
        text: PDF
    right:
      - icon: github
        href: https://github.com/JamiesonLabUTSW/oasis
        aria-label: OASIS project repository
  open-graph: true
  page-footer:
    left: "OASIS — Open Assessment and Scoring Infrastructure Stack"
    right:
      - text: Technical report
        href: paper/paper.html
      - text: Jamieson Lab at UT Southwestern
        href: https://labs.utsouthwestern.edu/jamieson-lab
      - text: Andrew Jamieson faculty profile
        href: https://profiles.utsouthwestern.edu/profile/170480/andrew-jamieson.html

format:
  html:
    theme:
      - cosmo
      - theme.scss
    css: styles.css
    toc: false
    anchor-sections: false
    code-copy: false
    smooth-scroll: false
